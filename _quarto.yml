project:
  type: website
  output-dir: docs
  preview:
    port: 4200

website:
  title: "Homophony"
  google-analytics: G-C5FTH8QPGW
  twitter-card: true
  open-graph: true
  site-url: "https://homophony.quest"
  description: "Music and notes by Homophony"
  navbar:
    left:
      - href: index.qmd
        text: Albums
      - about.qmd
      - notes.qmd
    right:
      - icon: rss
        href: notes.xml
      - icon: bluesky
        href: https://bsky.app/profile/mattcrumplab.bsky.social
        aria-label: Bluesky
      - icon: mastodon
        href: https://fosstodon.org/@MattCrumpLab
        aria-label: Mastodon
      - icon: youtube
        href: https://www.youtube.com/channel/UCmzAb7gmWJBQ0zX3spqxrNQ
        aria-label: Youtube
      - icon: spotify
        href: https://open.spotify.com/artist/21uZHA1jqXKOdkQmxR7ZcE?si=M2xiVdJpQG6OXuPW7URveg
      - icon: apple
        href: https://music.apple.com/us/artist/homophony/1531902633
  page-footer:
    center:
      - text: "Homophony, 2020–2026"
        href: about.qmd
      - text: "Published with Quarto"
        href: https://quarto.org
execute:
  # Re-run a post's R/Python only when its source changes; results live in _freeze/
  freeze: auto

format:
  html:
    theme:
      - darkly
      - themes/synth.scss
    css: themes/layout.css
    toc: true
